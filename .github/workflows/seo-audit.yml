name: SEO Audit

on:
  # Bi-weekly: 1st and 15th of each month at 7 AM UTC (9 AM CET)
  schedule:
    - cron: "0 7 1,15 * *"
  # Manual trigger with optional comparison
  workflow_dispatch:
    inputs:
      skip_issue:
        description: "Skip GitHub Issue creation (just generate report)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: seo-audit
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  GSC_SITE_URL: "https://www.esdeveniments.cat/"
  GA4_PROPERTY_ID: "406884331"

jobs:
  seo-audit:
    name: Run SEO Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install --quiet \
            google-api-python-client \
            google-auth \
            google-analytics-data \
            requests

      - name: Authenticate with GCP
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-sa-key.json" >> $GITHUB_ENV

      - name: Find previous audit data
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Audits are kept as run artifacts (develop is protected, so the job
          # can't commit them). Fall back to the last audit committed to the repo.
          mkdir -p /tmp/prev-audit
          PREV_RUN=$(gh run list --workflow seo-audit.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$PREV_RUN" ]; then
            gh run download "$PREV_RUN" --name seo-audit --dir /tmp/prev-audit || true
          fi
          # Only dated audit files (YYYY-MM-DD.json), not keywords-*.json
          LATEST=$(ls -1 /tmp/prev-audit/[0-9]*.json data/seo-audits/[0-9]*.json 2>/dev/null \
            | awk -F/ '{print $NF"\t"$0}' | sort -r | head -1 | cut -f2)
          if [ -n "$LATEST" ]; then
            echo "📂 Found previous audit: $LATEST"
            echo "path=$LATEST" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "📂 No previous audit data found (first run)"
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Run SEO audit
        id: audit
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          RUN_DATE=$(date -u +%Y-%m-%d)
          mkdir -p data/seo-audits

          PREV_ARGS=()
          if [ "${{ steps.previous.outputs.found }}" = "true" ]; then
            PREV_ARGS=(--previous "${{ steps.previous.outputs.path }}")
          fi

          SEO_AUDIT_OUTPUT_DIR=data/seo-audits \
            python scripts/seo-audit.py --country Spain "${PREV_ARGS[@]}"

          # Rename output files with date
          mv data/seo-audits/seo-audit-data.json "data/seo-audits/${RUN_DATE}.json"
          mv data/seo-audits/seo-audit-report.md "data/seo-audits/${RUN_DATE}.md"

          echo "run_date=$RUN_DATE" >> $GITHUB_OUTPUT

      - name: Upload audit data
        uses: actions/upload-artifact@v7
        with:
          name: seo-audit
          path: |
            data/seo-audits/${{ steps.audit.outputs.run_date }}.json
            data/seo-audits/${{ steps.audit.outputs.run_date }}.md
          retention-days: 90

      - name: Create GitHub Issue
        if: ${{ github.event.inputs.skip_issue != 'true' }}
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "📊 SEO Audit — ${{ steps.audit.outputs.run_date }}"
          content-filepath: data/seo-audits/${{ steps.audit.outputs.run_date }}.md
          labels: seo,automated-audit
          assignees: albertolive

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/gcp-sa-key.json
