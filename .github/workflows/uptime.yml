name: Uptime Monitor

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  check-uptime:
    runs-on: ubuntu-latest
    steps:
      - name: Check site availability
        id: check
        run: |
          # Fetch the homepage
          response=$(curl -s -o /tmp/response.html -w "%{http_code}" https://www.esdeveniments.cat)
          
          # Check HTTP status code
          if [ "$response" != "200" ]; then
            echo "❌ Site returned HTTP $response instead of 200"
            echo "error_message=Site returned HTTP $response instead of 200" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Check for keyword to ensure page rendered correctly
          if ! grep -q "esdeveniments.cat" /tmp/response.html; then
            echo "❌ Keyword 'esdeveniments.cat' not found in page content"
            echo "error_message=Keyword 'esdeveniments.cat' not found in page content" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Probe the image proxy with a first-party static asset. A May 2026
          # dispatcher regression 502'd every proxied image while the homepage
          # stayed 200, so a homepage-only check would have missed it. Using our
          # own static image (not a third party) means a failure here is our
          # proxy, not a flaky upstream. Retry to absorb transient blips.
          IMG="https://www.esdeveniments.cat/static/icons/icon-512x512.png"
          PROXY="https://www.esdeveniments.cat/api/image-proxy?url=$(printf '%s' "$IMG" | sed 's/:/%3A/g; s|/|%2F|g')&w=64&q=50"
          proxy_ok=""
          for attempt in 1 2 3; do
            # The step runs under `bash -eo pipefail`, so guard curl and grep:
            # a transport failure (curl exits non-zero) or an empty header file
            # (grep finds nothing) would otherwise abort the step before the
            # retry/fallback runs, defeating the whole loop.
            : > /tmp/proxy.head
            if ! code=$(curl -s -D /tmp/proxy.head -o /dev/null -w "%{http_code}" \
              -H "Accept: image/webp,image/*" --max-time 20 "$PROXY"); then
              code="000"
            fi
            ctype=$(grep -i '^content-type:' /tmp/proxy.head | tail -1 | tr -d '\r' || true)
            if [ "$code" = "200" ] && echo "$ctype" | grep -qi 'image/'; then
              proxy_ok="yes"
              break
            fi
            echo "⚠️ image-proxy attempt $attempt: HTTP $code, $ctype"
            sleep 5
          done
          if [ -z "$proxy_ok" ]; then
            echo "❌ Image proxy is broken (last: HTTP $code, $ctype)"
            echo "error_message=Image proxy returned HTTP $code ($ctype) for a known-good first-party image — the proxy is broken" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Assert server-rendered metadata is present in the RAW HTML (not
          # after JS). On Jun 11 2026 a stale Redis prerender shell made React
          # fall back to client rendering, dropping <title>/description/canonical
          # from SSR — invisible to a status-code check but an SEO hard-fail.
          # /tmp/response.html is the already-fetched homepage.
          missing=""
          grep -qi '<title[^>]*>[^<]\+</title>' /tmp/response.html || missing="$missing <title>"
          grep -qi 'name="description"' /tmp/response.html || missing="$missing meta-description"
          grep -qi 'rel="canonical"' /tmp/response.html || missing="$missing canonical"
          if [ -n "$missing" ]; then
            echo "❌ Homepage server HTML is missing SSR metadata:$missing"
            echo "error_message=Homepage SSR metadata missing ($missing) — likely a prerender/resume fallback to client rendering. SEO-critical." >> $GITHUB_OUTPUT
            exit 1
          fi

          # Probe one random event page. The homepage is served from the
          # Cloudflare cache, so it stayed 200 from Aug 18 to Nov 4 2026 while
          # Googlebot got 5xx and slow answers on event pages (#752). Event
          # pages usually miss that cache, so this measures the origin. A
          # missing or failed event still answers 200 (the shell has already
          # streamed), so also require its Event JSON-LD. No retry: a healthy
          # origin returns almost no errors, so one is worth a look.
          event_url=$(curl -s --max-time 20 https://www.esdeveniments.cat/sitemap-events/1.xml \
            | grep -oE '<loc>[^<]+/e/[^<]+</loc>' | sed 's/<[^>]*>//g' | shuf -n 1 || true)
          if [ -z "$event_url" ]; then
            echo "❌ No event URL found in /sitemap-events/1.xml"
            echo "error_message=No event URL found in /sitemap-events/1.xml" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # curl's exit code tells a timeout (28) from DNS (6), refused (7) or
          # TLS (35, 60) failures.
          result=$(curl -s -o /tmp/event.html --max-time 10 \
            -w "%{http_code} %{time_total}" "$event_url") || result="000 curl-exit-$?"
          echo "Event probe: $event_url → $result"
          if [ "${result%% *}" != "200" ]; then
            echo "❌ Event page returned ${result} (status, seconds; 10 s limit)"
            echo "error_message=Event page $event_url returned $result (HTTP status, seconds; 10 s limit) — the origin is failing or slow" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! grep -q '"@type":"Event"' /tmp/event.html; then
            echo "❌ Event page has no Event JSON-LD (not-found or error page)"
            echo "error_message=Event page $event_url answered 200 without Event JSON-LD — it rendered the not-found or error page (backend failing?)" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "✅ Site is up, content is valid, image proxy works, SSR metadata is present, and an event page answers"

      - name: Send email notification on failure
        if: failure()
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "🚨 Site Down Alert: esdeveniments.cat"
          to: ${{ secrets.UPTIME_ALERT_EMAIL }}
          from: ${{ secrets.SMTP_FROM }}
          body: |
            <h2>🚨 Site Down Alert</h2>
            <p>The uptime monitor detected that <strong>esdeveniments.cat</strong> is down or not responding correctly.</p>
            
            <h3>Details</h3>
            <ul>
              <li><strong>Error:</strong> ${{ steps.check.outputs.error_message || 'Unknown error - check workflow logs' }}</li>
              <li><strong>Time:</strong> ${{ github.run_started_at }}</li>
              <li><strong>Workflow Run:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View in GitHub</a></li>
            </ul>
            
            <h3>Action Required</h3>
            <p>Please check the site immediately: <a href="https://www.esdeveniments.cat">https://www.esdeveniments.cat</a></p>
            
            <p><small>This is an automated alert from the GitHub Actions uptime monitor.</small></p>
          content_type: text/html
