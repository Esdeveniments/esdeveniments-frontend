name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default token scope. Jobs that need more (none here) must opt in explicitly.
permissions:
  contents: read

env:
  NODE_VERSION: "26"
  # Single source of truth for CI: set in GitHub Settings > Variables > Repository variables
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.esdeveniments.cat/api' }}

jobs:
  quality:
    name: Code quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        # Node 25+ no longer bundles Corepack.
        run: npm install -g corepack@0.36.0 --no-audit --no-fund && corepack enable

      - name: Configure Yarn
        run: |
          yarn config set enableImmutableInstalls false
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/yarn.lock') }}-
      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Check i18n translations
        run: yarn i18n:check

      - name: Validate i18n placeholders
        run: yarn i18n:validate

      - name: Run unit tests with coverage (Vitest)
        env:
          CI: true
        run: yarn test:coverage

      - name: Generate service worker (prebuild)
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: yarn prebuild

      - name: Build application
        env:
          NODE_ENV: production
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          BACKEND_SERVICE_SECRET: ${{ secrets.BACKEND_SERVICE_SECRET }}
        run: yarn build

      - name: Analyze bundle sizes (JSON)
        run: node scripts/analyze-bundles-cli.mjs --format json > bundle-sizes.json

      - name: Compare bundle sizes against baseline
        run: node scripts/compare-bundle-sizes.mjs --baseline bundle-size-baseline.json --current bundle-sizes.json

      - name: Upload bundle sizes report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-sizes
          path: bundle-sizes.json
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (regression tripwire)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25

    env:
      LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        # Node 25+ no longer bundles Corepack.
        run: npm install -g corepack@0.36.0 --no-audit --no-fund && corepack enable

      - name: Configure Yarn
        run: |
          yarn config set enableImmutableInstalls false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate service worker (prebuild)
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: yarn prebuild

      - name: Build application
        env:
          NODE_ENV: production
        run: yarn build

      - name: Run Lighthouse CI
        env:
          NODE_ENV: production
        run: yarn lighthouse:ci

      # Warn only: thresholds sit just below a local mobile run (perf 78-82,
      # LCP 4.8-5.4 s). The move keeps desktop asserts off the mobile reports.
      - name: Run Lighthouse CI (mobile, warn only)
        continue-on-error: true
        env:
          NODE_ENV: production
        run: mv .lighthouseci .lighthouseci-desktop && yarn lighthouse:ci:mobile

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouseci-report
          path: |
            .lighthouseci-desktop/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: E2E tests (Playwright)
    # Push runs are covered by the Coolify deploy workflow (main) and add
    # nothing on develop, so only PRs pay for a build plus Playwright.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Corepack (Yarn 4)
        # Node 25+ no longer bundles Corepack.
        run: npm install -g corepack@0.36.0 --no-audit --no-fund && corepack enable

      - name: Configure Yarn
        run: |
          yarn config set enableImmutableInstalls false

      - name: Install dependencies
        run: yarn install --immutable

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/yarn.lock') }}

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          # Own key: this build inlines NEXT_PUBLIC_E2E_TEST_MODE, the quality
          # build does not, so the two must never share a compilation cache.
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/yarn.lock') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('**/yarn.lock') }}-

      - name: Generate service worker and robots.txt (prebuild)
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: yarn prebuild

      # Built here, not reused from the quality job: NEXT_PUBLIC_E2E_TEST_MODE
      # is inlined at build time and must not reach a build that others reuse.
      - name: Build application (E2E test mode)
        env:
          NODE_ENV: production
          E2E_TEST_MODE: "1"
          NEXT_PUBLIC_E2E_TEST_MODE: "1"
          NEXT_PUBLIC_SITE_URL: https://www.esdeveniments.cat
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          BACKEND_SERVICE_SECRET: ${{ secrets.BACKEND_SERVICE_SECRET }}
        run: yarn build

      # The app reads the backend and test-database settings at runtime, so
      # they go on the step that starts it. The *_TEST Stripe and Turso values
      # serve the payment specs and session refresh.
      - name: Start application (background)
        env:
          NODE_ENV: production
          PORT: "3000"
          E2E_TEST_MODE: "1"
          NEXT_PUBLIC_E2E_TEST_MODE: "1"
          NEXT_PUBLIC_SITE_URL: https://www.esdeveniments.cat
          # Server-side reads of the app's own /api go to this build, not to
          # production www (cached readers skip the request Host header).
          INTERNAL_SITE_URL: http://localhost:3000
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          BACKEND_SERVICE_SECRET: ${{ secrets.BACKEND_SERVICE_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL_TEST }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_TEST }}
        run: yarn start > /tmp/next-start.log 2>&1 &

      - name: Wait for application to be ready
        run: npx wait-on http://localhost:3000 --timeout 90000

      - name: Run E2E tests (Playwright)
        env:
          CI: true
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          # publica_to_event.flow.spec.ts skips unless this process sees it.
          E2E_TEST_MODE: "1"
          BACKEND_SERVICE_SECRET: ${{ secrets.BACKEND_SERVICE_SECRET }}
          # Enable payment E2E only on PRs targeting main — lets PRs to develop
          # iterate fast without hitting Stripe test mode every push.
          RUN_PAYMENT_E2E: ${{ github.event.pull_request.base.ref == 'main' && '1' || '' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL_TEST }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN_TEST }}
        run: yarn test:e2e -c playwright.remote.config.ts --workers=2

      - name: Show application log (on failure)
        if: failure()
        run: tail -n 200 /tmp/next-start.log || true


      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
